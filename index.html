<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fusion Lab | All-in-One</title>
    <style>
        /* --- CSS BAGIAN DESAIN --- */
        :root {
            --primary: #e94560;
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #533483;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .inventory {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin: 25px 0;
        }

        .item {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .item:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .forge-area {
            background: var(--accent);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .slot {
            width: 70px;
            height: 70px;
            background: var(--bg);
            border: 2px dashed white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { opacity: 0.8; transform: scale(1.05); }

        #resultContainer {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background: #0f3460;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ The Fusion Lab</h1>
        <p>Klik 2 alat di bawah untuk menggabungkannya!</p>

        <div class="inventory" id="inventory"></div>

        <div class="forge-area">
            <div class="slot" id="slot0">?</div>
            <span>+</span>
            <div class="slot" id="slot1">?</div>
        </div>

        <button onclick="combine()">GABUNGKAN SEKARANG</button>

        <div id="resultContainer" style="display: none;">
            <h2 id="resultEmoji" style="font-size: 3rem; margin: 0;"></h2>
            <p id="resultText"></p>
            <button onclick="reset()">Coba Lagi</button>
        </div>
    </div>

    <script>
        /* --- JS BAGIAN LOGIKA --- */
        const baseItems = [
            { id: 'kayu', emoji: '🪵', nama: 'Kayu' },
            { id: 'besi', emoji: '⛓️', nama: 'Besi' },
            { id: 'api', emoji: '🔥', nama: 'Api' },
            { id: 'kaca', emoji: '💎', nama: 'Kaca' }
        ];

        const recipes = {
            "besi+kayu": { nama: "Kapak Perang", emoji: "🪓" },
            "api+besi": { nama: "Pedang Legendaris", emoji: "⚔️" },
            "api+kayu": { nama: "Obor", emoji: "🔦" },
            "besi+kaca": { nama: "Kacamata", emoji: "👓" },
            "api+kaca": { nama: "Lensa Kontak Magic", emoji: "👁️" }
        };

        let selected = [];

        // Render Inventory
        const invEl = document.getElementById('inventory');
        baseItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `${item.emoji}<br>${item.nama}`;
            div.onclick = () => select(item);
            invEl.appendChild(div);
        });

        function select(item) {
            if (selected.length < 2) {
                selected.push(item);
                drawSlots();
            }
        }

        function drawSlots() {
            for (let i = 0; i < 2; i++) {
                document.getElementById(`slot${i}`).innerText = selected[i] ? selected[i].emoji : "?";
            }
        }

        function combine() {
            if (selected.length < 2) return alert("Pilih 2 alat dulu!");

            const combo = selected.map(i => i.id).sort().join('+');
            const result = recipes[combo];
            
            const resCont = document.getElementById('resultContainer');
            resCont.style.display = "block";

            if (result) {
                document.getElementById('resultEmoji').innerText = result.emoji;
                document.getElementById('resultText').innerHTML = `Luar Biasa! Kamu menciptakan <b>${result.nama}</b>`;
            } else {
                document.getElementById('resultEmoji').innerText = "💨";
                document.getElementById('resultText').innerText = "Zonk! Kombinasi ini hanya menghasilkan asap.";
            }
        }

        function reset() {
            selected = [];
            drawSlots();
            document.getElementById('resultContainer').style.display = "none";
        }
    </script>
</body>
</html>
